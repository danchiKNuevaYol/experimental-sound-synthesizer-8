<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental Sound Synthesizer</title>
  <meta name="description" content="Веб-синтезатор искусственных природных звуков: дождь, ветер, гроза и лес из простых электронных сигналов, без сэмплов.">

  <!-- Шрифты. Чтобы сменить: поменяйте ссылку здесь и имена в src/styles/fonts.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <!-- Стили: шрифты → тема → блоки интерфейса (src/styles/blocks/*.css) -->
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
<div class="stage">
  <div class="stage__fit">
    <main class="device" aria-label="Experimental Sound Synthesizer">

      <header class="device__head">
        <h1 class="device__title">EXPERIMENTAL SOUND SYNTHESIZER</h1>
        <nav class="scene-bar" aria-label="Звуковые сцены"></nav>
        <p class="device__sub">ГЕНЕРАТОР ИСКУССТВЕННЫХ ПРИРОДНЫХ СРЕД</p>
      </header>

      <div class="device__row device__row--top">

        <!-- 01 · Голос A -->
        <section class="panel panel--voice" aria-labelledby="t-voice-a">
          <h2 class="panel__title" id="t-voice-a"><i class="dot dot--a"></i>ГОЛОС A · АТМОСФЕРА</h2>
          <div class="wave-switch" data-param="a.wave" data-channel="a"></div>
          <div class="panel__knobs">
            <div class="knob" data-param="a.tune"  data-label="ТОН"     data-channel="a" data-format="hz-a" data-default="0.4"></div>
            <div class="knob" data-param="a.shape" data-label="ФОРМА"   data-default="0.4"></div>
            <div class="knob" data-param="a.mod"   data-label="ДРЕЙФ"   data-default="0.4"></div>
            <div class="knob" data-param="a.level" data-label="УРОВЕНЬ" data-channel="a" data-default="0.7"></div>
          </div>
        </section>

        <!-- 02 · Дисплей -->
        <section class="panel panel--display" aria-label="Дисплей">
          <div class="display"></div>
        </section>

        <!-- 03 · Голос B -->
        <section class="panel panel--voice" aria-labelledby="t-voice-b">
          <h2 class="panel__title" id="t-voice-b"><i class="dot dot--b"></i>ГОЛОС B · ЭЛЕМЕНТЫ</h2>
          <div class="wave-switch" data-param="b.wave" data-channel="b"></div>
          <div class="panel__knobs">
            <div class="knob" data-param="b.tune"    data-label="ТОН"     data-channel="b" data-format="hz-b" data-default="0.4"></div>
            <div class="knob" data-param="b.texture" data-label="ФАКТУРА" data-default="0.4"></div>
            <div class="knob" data-param="b.mod"     data-label="ВИБРО"   data-default="0.4"></div>
            <div class="knob" data-param="b.level"   data-label="УРОВЕНЬ" data-channel="b" data-default="0.7"></div>
          </div>
        </section>

        <!-- 04 · Цепочка эффектов выбранного канала -->
        <section class="panel panel--fx fx-rack" aria-labelledby="t-fx">
          <h2 class="panel__title" id="t-fx"><i class="dot dot--fx"></i>ЭФФЕКТЫ · ЦЕПЬ</h2>
          <div class="fx-rack__tabs" role="tablist" aria-label="Чья цепочка эффектов">
            <button type="button" class="fx-rack__tab fx-rack__tab--a" role="tab" data-target="a" title="Цепочка голоса A — клавиша Q">A</button>
            <button type="button" class="fx-rack__tab fx-rack__tab--b" role="tab" data-target="b" title="Цепочка голоса B — клавиша W">B</button>
            <button type="button" class="fx-rack__tab fx-rack__tab--p" role="tab" data-target="p" title="Цепочка частиц — клавиша E">Ч</button>
          </div>
          <div class="fx-rack__chain">
            <div class="knob" data-param="fx.*.drive"  data-label="1 ДРАЙВ"  data-color="dark" data-size="46" data-default="0"></div>
            <div class="knob" data-param="fx.*.mod"    data-label="2 МОДУЛ." data-size="46" data-default="0"></div>
            <div class="knob" data-param="fx.*.delay"  data-label="3 ЭХО"    data-channel="*" data-size="46" data-default="0"></div>
            <div class="knob" data-param="fx.*.reverb" data-label="4 РЕВЕРБ" data-size="46" data-default="0"></div>
          </div>
        </section>
      </div>

      <div class="device__row device__row--bottom">

        <!-- 05 · Ритм частиц -->
        <section class="panel panel--rhythm" aria-labelledby="t-rhythm">
          <h2 class="panel__title" id="t-rhythm"><i class="dot dot--p"></i>РИТМ · ЧАСТИЦЫ</h2>
          <div class="step-grid"></div>
        </section>

        <!-- 06 · Микшер: у каждого канала панорама, индикатор и фейдер -->
        <section class="panel panel--mixer mixer" aria-labelledby="t-mixer">
          <h2 class="panel__title" id="t-mixer"><i class="dot dot--master"></i>МИКШЕР · КАНАЛЫ</h2>
          <div class="mixer__strips">
            <div class="mixer__strip">
              <div class="knob" data-param="pan.a" data-channel="a" data-size="32" data-format="pan" data-hint="Панорама A" data-default="0.5"></div>
              <div class="mixer__body"><div class="meter" data-meter="a"></div><div class="fader" data-param="mix.a" data-label="A"></div></div>
            </div>
            <div class="mixer__strip">
              <div class="knob" data-param="pan.b" data-channel="b" data-size="32" data-format="pan" data-hint="Панорама B" data-default="0.5"></div>
              <div class="mixer__body"><div class="meter" data-meter="b"></div><div class="fader" data-param="mix.b" data-label="B"></div></div>
            </div>
            <div class="mixer__strip">
              <div class="knob" data-param="pan.p" data-channel="p" data-size="32" data-format="pan" data-hint="Панорама частиц" data-default="0.5"></div>
              <div class="mixer__body"><div class="meter" data-meter="p"></div><div class="fader" data-param="mix.p" data-label="ЧАСТИЦЫ"></div></div>
            </div>
            <div class="mixer__strip mixer__strip--master">
              <div class="knob" data-param="tone" data-channel="master" data-size="32" data-hint="Яркость общего канала" data-default="0.75"></div>
              <div class="mixer__body"><div class="meter" data-meter="master"></div><div class="fader" data-param="mix.master" data-label="ОБЩИЙ"></div></div>
            </div>
          </div>
        </section>

        <!-- 07 · Запись -->
        <section class="panel panel--record recorder" aria-labelledby="t-rec">
          <h2 class="panel__title" id="t-rec"><i class="dot dot--rec"></i>ЗАПИСЬ</h2>
          <button type="button" class="recorder__pad" aria-label="Начать или закончить запись (клавиша R)" title="Запись — клавиша R">
            <span class="recorder__btn"></span>
          </button>
          <div class="lcd">
            <i class="lcd__dot"></i>
            <b class="lcd__time">00:00</b>
            <small class="lcd__status">ГОТОВ К ЗАПИСИ</small>
          </div>
          <div class="recorder__transport">
            <button type="button" class="key key--small" data-action="play" aria-label="Играть" title="Играть — пробел">▶</button>
            <button type="button" class="key key--small" data-action="stop" aria-label="Стоп" title="Стоп — пробел">■</button>
            <button type="button" class="key key--small" data-action="save" aria-label="Скачать запись" title="Скачать запись (WAV)">⭳</button>
          </div>
        </section>
      </div>

      <footer class="device__foot">
        <span>ESS — 01</span>
        <span class="device__keys">ПРОБЕЛ — СТАРТ / СТОП · R — ЗАПИСЬ · 1–5 — СЦЕНЫ · Q W E — ЦЕПЬ A / B / Ч</span>
        <span>ВЕБ-АУДИО ИНСТРУМЕНТ</span>
      </footer>
    </main>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
